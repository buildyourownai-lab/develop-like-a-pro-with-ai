name: StockBriefing
options:
  bundleIdPrefix: com.everyoneisdeveloper
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
targets:
  StockBriefing:
    type: application
    platform: iOS
    sources:
      - path: StockBriefing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everyoneisdeveloper.stockbriefing
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Debug:
          INFOPLIST_FILE: StockBriefing/Resources/Info-Debug.plist
        Release:
          INFOPLIST_FILE: StockBriefing/Resources/Info-Release.plist
    scheme:
      testTargets:
        - StockBriefingTests
        - StockBriefingUITests
  StockBriefingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StockBriefingTests
    dependencies:
      - target: StockBriefing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everyoneisdeveloper.stockbriefing.tests
        GENERATE_INFOPLIST_FILE: YES
  StockBriefingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StockBriefingUITests
    dependencies:
      - target: StockBriefing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.everyoneisdeveloper.stockbriefing.uitests
        GENERATE_INFOPLIST_FILE: YES
