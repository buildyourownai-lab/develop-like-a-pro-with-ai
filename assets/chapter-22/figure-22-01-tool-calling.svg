<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1244" height="735" viewBox="-22 136 1244 735" role="img" aria-labelledby="title desc">
  <title id="title">AI는 제안하고, 서버가 검사해 실행합니다</title>
  <desc id="desc">기존 종목 찾기·가격 요약·공시 조회 기능을 그대로 재사용합니다. 이 그림은 실행 화면이 아니라 설명용 벡터 도식입니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#255B8E" />
    </marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1F2937" flood-opacity=".10" />
  </filter>
  <linearGradient id="inputBg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#F4F8FF" /><stop offset="1" stop-color="#E6F0FF" />
  </linearGradient>
  <linearGradient id="autoBg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#F3FBF8" /><stop offset="1" stop-color="#E6F6F0" />
  </linearGradient>
  <linearGradient id="humanBg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#FFF9EF" /><stop offset="1" stop-color="#FFF0D8" />
  </linearGradient>
  <linearGradient id="noneBg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#FAF8FF" /><stop offset="1" stop-color="#F0E8FF" />
  </linearGradient>
</defs>
  <rect x="-22" y="136" width="1244" height="735" fill="#FFFFFF" />
  <rect x="48" y="206" width="330" height="199" rx="24" fill="url(#inputBg)" stroke="#D3DFEB" stroke-width="2" filter="url(#shadow)" />
  <rect x="48" y="206" width="7" height="199" rx="3" fill="#255B8E" />
  <text x="72" y="249" font-family="Arial,'Noto Sans KR',sans-serif" font-size="27" font-weight="700" fill="#255B8E" text-anchor="start">사용자 질문</text>
  <text x="72" y="292.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="400" fill="#667085" text-anchor="start">삼성전자의 최근 공시</text>
  <text x="72" y="331.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="400" fill="#667085" text-anchor="start">다섯 건만 보여줘</text>
  <rect x="437" y="206" width="330" height="199" rx="24" fill="url(#inputBg)" stroke="#D3DFEB" stroke-width="2" filter="url(#shadow)" />
  <rect x="437" y="206" width="7" height="199" rx="3" fill="#255B8E" />
  <text x="461" y="249" font-family="Arial,'Noto Sans KR',sans-serif" font-size="27" font-weight="700" fill="#255B8E" text-anchor="start">AI의 제안</text>
  <text x="461" y="292.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="400" fill="#667085" text-anchor="start">필요한 기능 이름</text>
  <text x="461" y="331.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="400" fill="#667085" text-anchor="start">그 기능에 넘길 입력값</text>
  <rect x="826" y="206" width="326" height="199" rx="24" fill="url(#humanBg)" stroke="#D3DFEB" stroke-width="2" filter="url(#shadow)" />
  <rect x="826" y="206" width="7" height="199" rx="3" fill="#9A641E" />
  <text x="850" y="249" font-family="Arial,'Noto Sans KR',sans-serif" font-size="27" font-weight="700" fill="#9A641E" text-anchor="start">서버의 검사</text>
  <text x="850" y="292.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="400" fill="#667085" text-anchor="start">허용 목록 · 입력 범위</text>
  <text x="850" y="331.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="400" fill="#667085" text-anchor="start">실제 종목 · 호출 상한</text>
  <line x1="379" y1="308" x2="435" y2="308" stroke="#255B8E" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="768" y1="308" x2="824" y2="308" stroke="#255B8E" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="985" y1="407" x2="985" y2="480" stroke="#255B8E" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="826" y="484" width="326" height="221" rx="24" fill="url(#autoBg)" stroke="#D3DFEB" stroke-width="2" filter="url(#shadow)" />
  <rect x="826" y="484" width="7" height="221" rx="3" fill="#397D72" />
  <text x="850" y="527" font-family="Arial,'Noto Sans KR',sans-serif" font-size="27" font-weight="700" fill="#397D72" text-anchor="start">기존 조회 실행</text>
  <text x="850" y="570.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="400" fill="#667085" text-anchor="start">실제 결과와 기준일</text>
  <text x="850" y="609.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="400" fill="#667085" text-anchor="start">출처를 함께 돌려줌</text>
  <rect x="437" y="484" width="330" height="221" rx="24" fill="url(#inputBg)" stroke="#D3DFEB" stroke-width="2" filter="url(#shadow)" />
  <rect x="437" y="484" width="7" height="221" rx="3" fill="#255B8E" />
  <text x="461" y="527" font-family="Arial,'Noto Sans KR',sans-serif" font-size="27" font-weight="700" fill="#255B8E" text-anchor="start">근거 안의 답변</text>
  <text x="461" y="570.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="400" fill="#667085" text-anchor="start">사용한 종목과 자료</text>
  <text x="461" y="609.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="400" fill="#667085" text-anchor="start">출처 · 모르는 범위</text>
  <rect x="48" y="484" width="330" height="221" rx="24" fill="url(#inputBg)" stroke="#D3DFEB" stroke-width="2" filter="url(#shadow)" />
  <rect x="48" y="484" width="7" height="221" rx="3" fill="#255B8E" />
  <text x="72" y="527" font-family="Arial,'Noto Sans KR',sans-serif" font-size="27" font-weight="700" fill="#255B8E" text-anchor="start">사용자가 확인</text>
  <text x="72" y="570.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="400" fill="#667085" text-anchor="start">결과와 원문 대조</text>
  <text x="72" y="609.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="400" fill="#667085" text-anchor="start">필요하면 다음 질문</text>
  <line x1="824" y1="594" x2="770" y2="594" stroke="#255B8E" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="435" y1="594" x2="381" y2="594" stroke="#255B8E" stroke-width="3" marker-end="url(#arrow)" />
  <text x="48" y="781" font-family="Arial,'Noto Sans KR',sans-serif" font-size="22" font-weight="600" fill="#667085" text-anchor="start">AI가 데이터베이스·운영체제·거래 계정에 직접 명령하는 구조가 아닙니다.</text>
</svg>