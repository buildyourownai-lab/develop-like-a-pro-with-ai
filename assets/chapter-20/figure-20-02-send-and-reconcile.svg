<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910" role="img" aria-labelledby="title desc">
  <title id="title">응답이 없다고 다시 보내지 않습니다</title>
  <desc id="desc">전송할 권한을 먼저 기록하고, 실제 결과가 확인된 뒤에 상태를 마칩니다. 이 그림은 실행 화면이 아니라 설명용 벡터 도식입니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1460CE" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="910" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.8" />
  <text x="48" y="40" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#1460CE" text-anchor="start">20 / 02</text>
  <text x="48" y="94" font-family="Arial,'Noto Sans KR',sans-serif" font-size="37" font-weight="700" fill="#10243A" text-anchor="start">응답이 없다고 다시 보내지 않습니다</text>
  <text x="48" y="136" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" font-weight="400" fill="#546477" text-anchor="start">전송할 권한을 먼저 기록하고, 실제 결과가 확인된 뒤에 상태를 마칩니다.</text>
  <line x1="48" y1="845" x2="1152" y2="845" stroke="#B4C4D7" stroke-width="1" />
  <text x="48" y="881" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="500" fill="#546477" text-anchor="start">프로처럼 AI로 코딩 없이 개발하기  ·  PART 6</text>
  <text x="1152" y="881" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#546477" text-anchor="end">개념도 · 실제 실행 화면 아님</text>
  <rect x="300" y="200" width="600" height="146" rx="14" fill="#EAF2FD" stroke="#B4C4D7" stroke-width="1.8" />
  <rect x="300" y="200" width="7" height="146" rx="3" fill="#1460CE" />
  <text x="324" y="243" font-family="Arial,'Noto Sans KR',sans-serif" font-size="29" font-weight="700" fill="#1460CE" text-anchor="start">전송 전에 기록</text>
  <text x="324" y="286.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="25" font-weight="400" fill="#546477" text-anchor="start">DB에서 한 실행만 선점 → 허용 상태 재확인 → 전송</text>
  <path d="M 600 347 L 600 382 L 235 382 L 235 420" fill="none" stroke="#1460CE" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M 600 347 L 600 382 L 600 382 L 600 420" fill="none" stroke="#1460CE" stroke-width="2.5" marker-end="url(#arrow)" />
  <path d="M 600 347 L 600 382 L 965 382 L 965 420" fill="none" stroke="#1460CE" stroke-width="2.5" marker-end="url(#arrow)" />
  <rect x="48" y="424" width="334" height="218" rx="14" fill="#E8F5F0" stroke="#B4C4D7" stroke-width="1.8" />
  <rect x="48" y="424" width="7" height="218" rx="3" fill="#15766C" />
  <text x="72" y="467" font-family="Arial,'Noto Sans KR',sans-serif" font-size="29" font-weight="700" fill="#15766C" text-anchor="start">성공 확인</text>
  <text x="72" y="510.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">실제 답글 ID를 저장</text>
  <text x="72" y="549.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">같은 댓글은 보내지 않음</text>
  <rect x="433" y="424" width="334" height="218" rx="14" fill="#EAF2FD" stroke="#B4C4D7" stroke-width="1.8" />
  <rect x="433" y="424" width="7" height="218" rx="3" fill="#1460CE" />
  <text x="457" y="467" font-family="Arial,'Noto Sans KR',sans-serif" font-size="29" font-weight="700" fill="#1460CE" text-anchor="start">확실한 실패</text>
  <text x="457" y="510.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">미전송 근거를 기록</text>
  <text x="457" y="549.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">권한·입력 원인부터 확인</text>
  <rect x="818" y="424" width="334" height="218" rx="14" fill="#FFF4E3" stroke="#B4C4D7" stroke-width="1.8" />
  <rect x="818" y="424" width="7" height="218" rx="3" fill="#8B5818" />
  <text x="842" y="467" font-family="Arial,'Noto Sans KR',sans-serif" font-size="29" font-weight="700" fill="#8B5818" text-anchor="start">결과 미확인</text>
  <text x="842" y="510.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">자동 전송을 멈춤</text>
  <text x="842" y="549.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">잠금 만료만으로</text>
  <text x="842" y="589.04" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">다시 보내지 않음</text>
  <line x1="985" y1="643" x2="985" y2="691" stroke="#1460CE" stroke-width="3" marker-end="url(#arrow)" />
  <rect x="48" y="700" width="1104" height="114" rx="14" fill="#FFF4E3" stroke="#B4C4D7" stroke-width="1.8" />
  <text x="74" y="741" font-family="Arial,'Noto Sans KR',sans-serif" font-size="28" font-weight="700" fill="#8B5818" text-anchor="start">원래 댓글의 실제 답글 목록과 기록을 대조합니다.</text>
  <text x="74" y="783" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" font-weight="400" fill="#546477" text-anchor="start">확인할 수 없으면 사람 확인 상태를 유지합니다. 성공을 추정하거나 자동 재전송하지 않습니다.</text>
</svg>