<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">자동화의 범위는 켜기 전에 정합니다</title>
  <desc id="desc">작게 시작하고, 승인한 범위를 넘어가면 실행하지 않습니다. 이 그림은 실행 화면이 아니라 설명용 벡터 도식입니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1460CE" />
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="760" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.8" />
  <text x="48" y="40" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#1460CE" text-anchor="start">20 / 01</text>
  <text x="48" y="94" font-family="Arial,'Noto Sans KR',sans-serif" font-size="37" font-weight="700" fill="#10243A" text-anchor="start">자동화의 범위는 켜기 전에 정합니다</text>
  <text x="48" y="136" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" font-weight="400" fill="#546477" text-anchor="start">작게 시작하고, 승인한 범위를 넘어가면 실행하지 않습니다.</text>
  <line x1="48" y1="695" x2="1152" y2="695" stroke="#B4C4D7" stroke-width="1" />
  <text x="48" y="731" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="500" fill="#546477" text-anchor="start">프로처럼 AI로 코딩 없이 개발하기  ·  PART 6</text>
  <text x="1152" y="731" font-family="Arial,'Noto Sans KR',sans-serif" font-size="18" font-weight="400" fill="#546477" text-anchor="end">개념도 · 실제 실행 화면 아님</text>
  <rect x="48" y="210" width="340" height="180" rx="14" fill="#EAF2FD" stroke="#B4C4D7" stroke-width="1.8" />
  <rect x="48" y="210" width="7" height="180" rx="3" fill="#1460CE" />
  <text x="72" y="253" font-family="Arial,'Noto Sans KR',sans-serif" font-size="29" font-weight="700" fill="#1460CE" text-anchor="start">대상</text>
  <text x="72" y="296.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">내 채널 · 승인한 영상 한 편</text>
  <text x="72" y="335.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">공개된 최상위 댓글</text>
  <rect x="430" y="210" width="340" height="180" rx="14" fill="#EAF2FD" stroke="#B4C4D7" stroke-width="1.8" />
  <rect x="430" y="210" width="7" height="180" rx="3" fill="#1460CE" />
  <text x="454" y="253" font-family="Arial,'Noto Sans KR',sans-serif" font-size="29" font-weight="700" fill="#1460CE" text-anchor="start">시간</text>
  <text x="454" y="296.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">시작 시각 이후</text>
  <text x="454" y="335.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">현재 시점에서 7일 이내</text>
  <rect x="812" y="210" width="340" height="180" rx="14" fill="#E8F5F0" stroke="#B4C4D7" stroke-width="1.8" />
  <rect x="812" y="210" width="7" height="180" rx="3" fill="#15766C" />
  <text x="836" y="253" font-family="Arial,'Noto Sans KR',sans-serif" font-size="29" font-weight="700" fill="#15766C" text-anchor="start">판정</text>
  <text x="836" y="296.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">허용한 종류 + 두 검사</text>
  <text x="836" y="335.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">불확실하면 보내지 않음</text>
  <rect x="48" y="432" width="526" height="172" rx="14" fill="#EAF2FD" stroke="#B4C4D7" stroke-width="1.8" />
  <rect x="48" y="432" width="7" height="172" rx="3" fill="#1460CE" />
  <text x="72" y="475" font-family="Arial,'Noto Sans KR',sans-serif" font-size="29" font-weight="700" fill="#1460CE" text-anchor="start">실행량</text>
  <text x="72" y="518.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">10분마다 조회 · 분류 최대 20건</text>
  <text x="72" y="557.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">전송은 한 실행 1건 · 하루 5건</text>
  <rect x="626" y="432" width="526" height="172" rx="14" fill="#FFF4E3" stroke="#B4C4D7" stroke-width="1.8" />
  <rect x="626" y="432" width="7" height="172" rx="3" fill="#8B5818" />
  <text x="650" y="475" font-family="Arial,'Noto Sans KR',sans-serif" font-size="29" font-weight="700" fill="#8B5818" text-anchor="start">보존과 중단</text>
  <text x="650" y="518.0" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">실제 ID·상태를 서버에 기록</text>
  <text x="650" y="557.52" font-family="Arial,'Noto Sans KR',sans-serif" font-size="26" font-weight="400" fill="#546477" text-anchor="start">전송 결과 미확인 → 자동화 중지</text>
  <text x="48" y="659" font-family="Arial,'Noto Sans KR',sans-serif" font-size="24" font-weight="400" fill="#546477" text-anchor="start">표의 수치는 책의 작은 실습 범위이며, 외부 서비스의 공식 한도가 아닙니다.</text>
</svg>