<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1244" height="735" viewBox="-22 132 1244 735" role="img" aria-labelledby="title desc">
<title id="title">기존 화면에 대화의 입구를 더합니다</title><desc id="desc">데스크톱 오른쪽 레이어와 모바일 웹의 큰 레이어 설계. 실제 실행 화면이 아닙니다.</desc>
<rect x="-22" y="132" width="1244" height="735" fill="#FFFFFF" />
<g font-family="Arial,'Noto Sans KR',sans-serif" fill="#18212F">
<rect x="48" y="202" width="700" height="510" rx="24" fill="#FAFCFF" stroke="#D3DFEB" stroke-width="2" filter="url(#shadow)" />
<text x="72" y="245" font-size="27" font-weight="700">데스크톱</text><text x="72" y="293" font-size="22" fill="#667085">기존 시장·종목 화면 유지</text>
<rect x="399" y="270" width="320" height="374" rx="24" fill="white" stroke="#255B8E" stroke-width="2" filter="url(#shadow)" />
<text x="421" y="312" font-size="22" font-weight="700">대화 대상 · 지우기 · 닫기</text>
<rect x="419" y="340" width="280" height="83" rx="18" fill="url(#autoBg)" stroke-width="2" /><text x="435" y="374" font-size="22">확인된 자료</text><text x="435" y="405" font-size="19">질문 관련 자료와 출처</text>
<rect x="419" y="440" width="280" height="92" rx="24" fill="url(#inputBg)" stroke-width="2" /><text x="435" y="474" font-size="22">AI 일반 설명</text><text x="435" y="509" font-size="17">최신 확인 자료가 아닙니다</text>
<rect x="419" y="554" width="280" height="64" rx="18" fill="#FAFCFF" stroke="#D3DFEB" stroke-width="2" /><text x="435" y="594" font-size="22">질문 입력 · 보내기</text>
<circle cx="689" cy="674" r="22" fill="#255B8E" /><text x="433" y="682" font-size="22">우하단 대화 버튼 →</text>
<rect x="805" y="202" width="347" height="510" rx="24" fill="#FAFCFF" stroke="#D3DFEB" stroke-width="2" filter="url(#shadow)" />
<text x="829" y="245" font-size="27" font-weight="700">모바일 웹</text>
<rect x="823" y="269" width="311" height="233" rx="24" fill="white" stroke="#255B8E" stroke-width="2" filter="url(#shadow)" /><text x="845" y="308" font-size="22">대상 · 닫기</text><text x="845" y="360" font-size="22">넓은 답변 영역</text><text x="845" y="401" font-size="22" fill="#667085">스크롤로 계속 읽기</text><text x="845" y="476" font-size="22">질문 입력 · 보내기</text>
<rect x="823" y="516" width="311" height="118" rx="24" fill="url(#inputBg)" stroke-width="2" /><text x="845" y="565" font-size="22">화면 키보드 영역</text><text x="845" y="606" font-size="19">열린 상태에서 별도 검수</text><text x="839" y="672" font-size="19">하단 안전 여백 확보</text>
<text x="48" y="748" font-size="22">메인: 질문부터 입력 · 상세: 현재 종목을 기본 적용</text><text x="48" y="793" font-size="22">닫기: 원래 화면과 포커스로 복귀 · 추가 자료: 필요할 때 펼치기</text>
</g><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1F2937" flood-opacity=".10" />
  </filter>
  <linearGradient id="inputBg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#F4F8FF" /><stop offset="1" stop-color="#E6F0FF" />
  </linearGradient>
  <linearGradient id="autoBg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#F3FBF8" /><stop offset="1" stop-color="#E6F6F0" />
  </linearGradient>
  <linearGradient id="humanBg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#FFF9EF" /><stop offset="1" stop-color="#FFF0D8" />
  </linearGradient>
  <linearGradient id="noneBg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#FAF8FF" /><stop offset="1" stop-color="#F0E8FF" />
  </linearGradient>
</defs></svg>