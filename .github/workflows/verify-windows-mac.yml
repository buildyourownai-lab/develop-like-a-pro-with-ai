name: verify-windows-mac
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths:
      - ".github/workflows/verify-windows-mac.yml"
      - ".github/ci/**"
      - "support/**"
      - "tutor/**"
      - "chapters/**"
      - "chapters/getting-started/**"
defaults:
  run:
    shell: bash
jobs:
  support:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Invocation-scoped Git config for every git process in this job (including checkout); no global/system config is modified.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Support offline unit tests
        run: |
          rc=0
          python -m unittest discover -s support/tests -v > support-test.log 2>&1 || rc=$?
          tail -n 40 support-test.log
          [ $rc -eq 0 ] || exit $rc
          echo "::notice title=RESULT support ${{ matrix.os }}::offline support unit tests passed"
  tutor:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Invocation-scoped Git config for every git process in this job (including checkout); no global/system config is modified.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tutor unit tests and contract audit
        run: |
          cd tutor
          rc=0
          python -m unittest discover -s tests > unit.log 2>&1 || rc=$?
          tail -n 4 unit.log
          [ $rc -eq 0 ] || exit $rc
          python tutor_runtime.py audit-contracts > audit.log 2>&1 || rc=$?
          tail -n 4 audit.log
          [ $rc -eq 0 ] || exit $rc
      - name: Installer smoke (omit --tool, apply twice)
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          cd tutor
          python install_tutor.py --project "$RUNNER_TEMP/work" --apply > /dev/null
          python install_tutor.py --project "$RUNNER_TEMP/work" --apply > /dev/null
          test -f "$RUNNER_TEMP/work/.claude/skills/book-tutor/SKILL.md"
          test ! -e "$RUNNER_TEMP/work/AGENTS.md"
          echo "::notice title=RESULT tutor ${{ matrix.os }}::unit tests, audit and installer smoke passed"
  python-chapters:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        chapter: ["02", "03", "04", "05", "16", "17", "18"]
    runs-on: ${{ matrix.os }}
    env:
      # Invocation-scoped Git config for every git process in this job (including checkout); no global/system config is modified.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: ${{ matrix.chapter >= '16' && runner.os != 'macOS' }}
      - name: Install ffmpeg on macOS
        if: ${{ matrix.chapter >= '16' && runner.os == 'macOS' }}
        run: brew install ffmpeg
      - name: Test chapter project
        run: |
          cd chapters/ch${{ matrix.chapter }}/source/*/
          python -m pip install --quiet openpyxl pytest
          rc=0
          if [ "${{ matrix.chapter }}" \< "06" ]; then python build_movie_report.py > build.log 2>&1 || { rc=$?; echo "::error title=BUILD ch${{ matrix.chapter }}::$(tail -n 20 build.log | tr -d '\r' | tr '\n' '|' | cut -c1-1500)"; }; fi
          if [ $rc -eq 0 ]; then python -m pytest tests -q > test.log 2>&1 || rc=$?; fi
          last=$(tail -n 1 test.log 2>/dev/null)
          if [ $rc -ne 0 ]; then echo "::error title=FAIL ch${{ matrix.chapter }} ${{ matrix.os }}::$(tail -n 40 test.log | tr -d '\r' | tr '\n' '|' | cut -c1-2500)"; exit $rc; fi
          echo "::notice title=RESULT ch${{ matrix.chapter }} ${{ matrix.os }}::$last"
  node-chapters:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        chapter: ["06", "07", "08", "09", "10", "11", "12", "13", "14", "15", "19", "20", "21", "22"]
    runs-on: ${{ matrix.os }}
    env:
      # Invocation-scoped Git config for every git process in this job (including checkout); no global/system config is modified.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install, typecheck, test
        id: node_checks
        run: |
          cd chapters/ch${{ matrix.chapter }}/source/*/
          echo "npm-cache=$(npm config get cache | tr -d '\r')" >> "$GITHUB_OUTPUT"
          npm ci --no-audit --no-fund > install.log 2>&1 || { echo "install-failed=true" >> "$GITHUB_OUTPUT"; echo "::error title=INSTALL ch${{ matrix.chapter }} ${{ matrix.os }}::$(tail -n 20 install.log | tr -d '\r' | tr '\n' '|' | cut -c1-1500)"; exit 1; }
          tc="skipped (no tsconfig)"
          if [ -f tsconfig.json ]; then (npx next typegen >/dev/null 2>&1 || true); npx tsc --noEmit > tsc.log 2>&1 && tc="typecheck passed" || { echo "::error title=TYPECHECK ch${{ matrix.chapter }} ${{ matrix.os }}::$(tail -n 20 tsc.log | tr -d '\r' | tr '\n' '|' | cut -c1-1500)"; exit 1; }; fi
          # Do not invent service credentials. Keep normal test discovery and
          # npm's pretest build, explicitly skipping live checks in stock chapters.
          test_args=()
          if [[ "${{ matrix.chapter }}" > "08" && "${{ matrix.chapter }}" < "16" ]]; then
            node "$GITHUB_WORKSPACE/.github/ci/prepare-no-key-vitest.mjs"
            test_args=(-- --config .ci-vitest.config.mts)
            echo "::notice title=LIVE CHECKS ch${{ matrix.chapter }}::FSC/DART/viewer checks skipped in no-key CI; offline tests and build remain enabled"
          fi
          rc=0; npm test "${test_args[@]}" > test.log 2>&1 || rc=$?
          last=$(grep -E "Tests +[0-9]|passed|failed|pass [0-9]|fail [0-9]" test.log | tail -n 2 | tr '\n' ' ')
          if [ $rc -ne 0 ]; then echo "::error title=TESTS ch${{ matrix.chapter }} ${{ matrix.os }}::$tc; tests failed: $last :: $(grep -E 'FAIL|Error' test.log | head -n 8 | tr -d '\r' | tr '\n' '|' | cut -c1-1500)"; exit $rc; else echo "::notice title=RESULT ch${{ matrix.chapter }} ${{ matrix.os }}::$tc; $last"; fi
      - name: Stage npm install failure logs
        if: ${{ failure() && steps.node_checks.outputs.install-failed == 'true' }}
        env:
          NPM_CACHE_DIR: ${{ steps.node_checks.outputs.npm-cache }}
          CHAPTER: ${{ matrix.chapter }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          const source = path.join('chapters', `ch${process.env.CHAPTER}`, 'source');
          const project = fs.readdirSync(source, { withFileTypes: true }).find(entry => entry.isDirectory());
          const installLog = path.join(source, project.name, 'install.log');
          const staging = '.ci-npm-install-logs';
          fs.mkdirSync(staging, { recursive: true });
          fs.copyFileSync(installLog, path.join(staging, 'install.log'));
          // Stage only the debug log named by this failed install, not old cache logs.
          const content = fs.readFileSync(installLog, 'utf8');
          const match = /_logs[\\/]([^\\/\r\n]+-debug-\d+\.log)/.exec(content);
          if (match && process.env.NPM_CACHE_DIR) {
            const debugLog = path.join(process.env.NPM_CACHE_DIR, '_logs', match[1]);
            if (fs.existsSync(debugLog)) fs.copyFileSync(debugLog, path.join(staging, match[1]));
            else console.log('Referenced npm debug log is unavailable; preserving install.log.');
          }
          JS
      - name: Preserve npm install failure logs
        if: ${{ failure() && steps.node_checks.outputs.install-failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-install-ch${{ matrix.chapter }}-${{ matrix.os }}
          retention-days: 7
          # A single staging root avoids Windows workspace D: / npm cache C: conflicts.
          include-hidden-files: true
          path: .ci-npm-install-logs/
