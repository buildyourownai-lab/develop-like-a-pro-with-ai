name: verify-windows-mac
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/verify-windows-mac.yml"
defaults:
  run:
    shell: bash
jobs:
  tutor:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tutor unit tests and contract audit
        run: |
          cd tutor
          python -m unittest discover -s tests 2>&1 | tail -n 4
          python tutor_runtime.py audit-contracts | tail -n 4
      - name: Installer smoke (omit --tool, apply twice)
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          cd tutor
          python install_tutor.py --project "$RUNNER_TEMP/work" --apply > /dev/null
          python install_tutor.py --project "$RUNNER_TEMP/work" --apply > /dev/null
          test -f "$RUNNER_TEMP/work/.claude/skills/book-tutor/SKILL.md"
          test ! -e "$RUNNER_TEMP/work/AGENTS.md"
          echo "::notice title=RESULT tutor ${{ matrix.os }}::unit tests, audit and installer smoke passed"
  python-chapters:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        chapter: ["02", "03", "04", "05", "16", "17", "18"]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: FedericoCarboni/setup-ffmpeg@v3
        if: ${{ matrix.chapter >= '16' }}
      - name: Test chapter project
        run: |
          cd chapters/ch${{ matrix.chapter }}/source/*/
          python -m pip install --quiet openpyxl pytest
          rc=0
          if [ "${{ matrix.chapter }}" \< "06" ]; then python build_movie_report.py > build.log 2>&1 || { rc=$?; echo "::error title=BUILD ch${{ matrix.chapter }}::$(tail -n 20 build.log | tr '\n' '|' | cut -c1-1500)"; }; fi
          if [ $rc -eq 0 ]; then python -m pytest tests -q > test.log 2>&1 || rc=$?; fi
          last=$(tail -n 1 test.log 2>/dev/null)
          if [ $rc -ne 0 ]; then echo "::error title=FAIL ch${{ matrix.chapter }} ${{ matrix.os }}::$(tail -n 40 test.log | tr '\n' '|' | cut -c1-2500)"; exit $rc; fi
          echo "::notice title=RESULT ch${{ matrix.chapter }} ${{ matrix.os }}::$last"
  node-chapters:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        chapter: ["06", "07", "08", "09", "10", "11", "12", "13", "14", "15", "19", "20", "21", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Install, typecheck, test
        run: |
          cd chapters/ch${{ matrix.chapter }}/source/*/
          npm ci --no-audit --no-fund > install.log 2>&1 || { echo "::error title=INSTALL ch${{ matrix.chapter }} ${{ matrix.os }}::$(tail -n 20 install.log | tr '\n' '|' | cut -c1-1500)"; exit 1; }
          tc="skipped (no tsconfig)"
          if [ -f tsconfig.json ]; then npx tsc --noEmit > tsc.log 2>&1 && tc="typecheck passed" || { echo "::error title=TYPECHECK ch${{ matrix.chapter }} ${{ matrix.os }}::$(tail -n 20 tsc.log | tr '\n' '|' | cut -c1-1500)"; exit 1; }; fi
          # tests that call live services need the reader's own keys; fill placeholders so offline tests can run
          if [ -f .env.local.example ]; then sed -E 's/^([A-Za-z_0-9]+)=$/\1=dummy-key-for-ci/' .env.local.example > .env.local; fi
          rc=0; npm test > test.log 2>&1 || rc=$?
          last=$(grep -E "Tests +[0-9]|passed|failed|pass [0-9]|fail [0-9]" test.log | tail -n 2 | tr '\n' ' ')
          if [ $rc -ne 0 ]; then echo "::warning title=TESTS ch${{ matrix.chapter }} ${{ matrix.os }}::$tc; tests failed: $last :: $(grep -E 'FAIL|Error' test.log | head -n 8 | tr '\n' '|' | cut -c1-1500)"; else echo "::notice title=RESULT ch${{ matrix.chapter }} ${{ matrix.os }}::$tc; $last"; fi
